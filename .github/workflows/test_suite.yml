name: Test Suite

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  # Ruby 3.1 / 3.2 / 3.3 / 3.4 against the Rails versions the gemspec and
  # gemfiles/*.gemfile actually declare support for. Each cell is a real,
  # verified combination, not an invented one:
  #   - Rails 6.1 / Ruby 3.1: activesupport 6.1.x declares
  #     `required_ruby_version >= 2.5.0`; Rails 6.1 is NOT supported on
  #     Ruby 3.2+ (removed/changed VM APIs), so 3.1 is its ceiling here.
  #   - Rails 7.0 / Ruby 3.1: activesupport 7.0.x requires >= 2.7.0.
  #   - Rails 7.1 / Ruby 3.2: activesupport 7.1.x requires >= 2.7.0.
  #   - Rails 7.2 / Ruby 3.3: activesupport 7.2.x requires >= 3.1.0.
  #   - Rails 8.0 / Ruby 3.4: activesupport 8.0.x requires >= 3.2.0.
  # This is deliberately one cell per Rails version (not a full cross
  # product): the brief permits not testing every combination, and every
  # backend here already runs against in-process fakes (no real
  # DB/Redis/Mongo/Elasticsearch), so the matrix only needs to prove
  # ConsoleKit's own code against each supported Ruby/Rails pair.
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Every Ruby x Rails combination the gemspec permits: railties declares
        # >= 2.5 (6.1), >= 2.7 (7.0, 7.1), >= 3.1 (7.2) and >= 3.2 (8.0, 8.1),
        # none of them declare an upper bound, and this gem requires >= 3.1.
        #
        # Every cell gates. They all pass, including Rails 6.1 on Ruby 4.0, so
        # there is no combination this gem claims to support that CI tolerates
        # failing.
        include:
          - rails: "6.1"
            ruby: "3.1"
            gemfile: gemfiles/rails_6_1.gemfile
          - rails: "6.1"
            ruby: "3.2"
            gemfile: gemfiles/rails_6_1.gemfile
          - rails: "6.1"
            ruby: "3.3"
            gemfile: gemfiles/rails_6_1.gemfile
          - rails: "6.1"
            ruby: "3.4"
            gemfile: gemfiles/rails_6_1.gemfile
          - rails: "6.1"
            ruby: "4.0"
            gemfile: gemfiles/rails_6_1.gemfile
          - rails: "7.0"
            ruby: "3.1"
            gemfile: gemfiles/rails_7_0.gemfile
          - rails: "7.0"
            ruby: "3.2"
            gemfile: gemfiles/rails_7_0.gemfile
          - rails: "7.0"
            ruby: "3.3"
            gemfile: gemfiles/rails_7_0.gemfile
          - rails: "7.0"
            ruby: "3.4"
            gemfile: gemfiles/rails_7_0.gemfile
          - rails: "7.0"
            ruby: "4.0"
            gemfile: gemfiles/rails_7_0.gemfile
          - rails: "7.1"
            ruby: "3.1"
            gemfile: gemfiles/rails_7_1.gemfile
          - rails: "7.1"
            ruby: "3.2"
            gemfile: gemfiles/rails_7_1.gemfile
          - rails: "7.1"
            ruby: "3.3"
            gemfile: gemfiles/rails_7_1.gemfile
          - rails: "7.1"
            ruby: "3.4"
            gemfile: gemfiles/rails_7_1.gemfile
          - rails: "7.1"
            ruby: "4.0"
            gemfile: gemfiles/rails_7_1.gemfile
          - rails: "7.2"
            ruby: "3.1"
            gemfile: gemfiles/rails_7_2.gemfile
          - rails: "7.2"
            ruby: "3.2"
            gemfile: gemfiles/rails_7_2.gemfile
          - rails: "7.2"
            ruby: "3.3"
            gemfile: gemfiles/rails_7_2.gemfile
          - rails: "7.2"
            ruby: "3.4"
            gemfile: gemfiles/rails_7_2.gemfile
          - rails: "7.2"
            ruby: "4.0"
            gemfile: gemfiles/rails_7_2.gemfile
          - rails: "8.0"
            ruby: "3.2"
            gemfile: gemfiles/rails_8_0.gemfile
          - rails: "8.0"
            ruby: "3.3"
            gemfile: gemfiles/rails_8_0.gemfile
          - rails: "8.0"
            ruby: "3.4"
            gemfile: gemfiles/rails_8_0.gemfile
          - rails: "8.0"
            ruby: "4.0"
            gemfile: gemfiles/rails_8_0.gemfile
          - rails: "8.1"
            ruby: "3.2"
            gemfile: gemfiles/rails_8_1.gemfile
          - rails: "8.1"
            ruby: "3.3"
            gemfile: gemfiles/rails_8_1.gemfile
          - rails: "8.1"
            ruby: "3.4"
            gemfile: gemfiles/rails_8_1.gemfile
          - rails: "8.1"
            ruby: "4.0"
            gemfile: gemfiles/rails_8_1.gemfile
    name: Rails ${{ matrix.rails }} / Ruby ${{ matrix.ruby }}

    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/${{ matrix.gemfile }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run tests
        run: bundle exec rspec

  # Style/lint gate, on the primary Gemfile.
  rubocop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Run rubocop
        run: bundle exec rubocop

  # The Rakefile's own default task (spec + rubocop together), so a break in
  # `rake` itself - as opposed to its two halves run separately - is caught.
  rake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Run rake (spec + rubocop)
        run: bundle exec rake
