name: Test Suite

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        rails: ["6.1", "7.0", "7.1", "7.2", "8.0", "8.1"]
        ruby: ["3.1", "3.2", "3.3", "3.4", "4.0"]
        exclude:
          - rails: "8.0"
            ruby: "3.1"
          - rails: "8.1"
            ruby: "3.1"
        include:
          - rails: "6.1"
            gemfile: gemfiles/rails_6_1.gemfile
          - rails: "7.0"
            gemfile: gemfiles/rails_7_0.gemfile
          - rails: "7.1"
            gemfile: gemfiles/rails_7_1.gemfile
          - rails: "7.2"
            gemfile: gemfiles/rails_7_2.gemfile
          - rails: "8.0"
            gemfile: gemfiles/rails_8_0.gemfile
          - rails: "8.1"
            gemfile: gemfiles/rails_8_1.gemfile
    name: Rails ${{ matrix.rails }} / Ruby ${{ matrix.ruby }}

    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/${{ matrix.gemfile }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run tests
        run: bundle exec rspec

  rake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Run rake (spec + rubocop)
        run: bundle exec rake
