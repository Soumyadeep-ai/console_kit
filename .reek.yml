---
detectors:
  # rubocop:Style/AccessorGrouping conflict — RuboCop requires grouped attr_accessor which Reek
  # then flags as Attribute smell. Suppressions below are for public mutable value-object fields
  # that pipeline steps must read and write.
  Attribute:
    exclude:
      - ConsoleKit::Configuration#pipeline_steps
      - ConsoleKit::PipelineContext#resolved_tenant
      - ConsoleKit::PipelineContext#skip_selector
  # rubocop:Style/ConditionalAssignment conflict — SafeguardCheck#current_env must check whether
  # Rails.env is available at runtime before calling it; this intentional capability probe is not
  # a design smell but a safe-guard against environments where Rails module exists but is not booted.
  # rubocop:Style/ConditionalAssignment conflict — TenantConfigurator#apply_context uses respond_to?
  # to probe the configured context class at runtime. The class is user-supplied and its methods
  # are not known at load time; capability detection is required, not a design smell.
  ManualDispatch:
    exclude:
      - ConsoleKit::FiberStorage#detect_fiber_capability
      - ConsoleKit::Steps::SafeguardCheck#current_env
      - ConsoleKit::Steps::TenantConfigurator#apply_context
      # rubocop:Style/GuardClause conflict — Prompt#rails_or_env_var probes for Rails.env capability
      # at runtime to handle environments where Rails may or may not be loaded. This intentional
      # capability check is not a design smell but a necessary guard against missing dependencies.
      - ConsoleKit::Prompt#rails_or_env_var
      # rubocop:Style/GuardClause conflict — RailsConnectedToStrategy#available? probes for the
      # presence of ActiveRecord::Base and Rails::VERSION at runtime. Sharding support depends on
      # optional Rails dependencies, so capability detection is intentional, not a design smell.
      - ConsoleKit::Connections::RailsConnectedToStrategy#available?
  MissingSafeMethod:
    exclude:
      - ConsoleKit::Context
  # rubocop:Style/OptionalBooleanParameter conflict — RuboCop requires keyword boolean parameters
  # (Style/OptionalBooleanParameter) which Reek then flags as BooleanParameter smell.
  BooleanParameter:
    exclude:
      - ConsoleKit::PipelineContext#initialize
      - ConsoleKit::SwitchPipeline#run
      - ConsoleKit::Output#print_with
      # rubocop:Style/OptionalBooleanParameter conflict — Reporter#initialize uses verbose: keyword
      # (RuboCop-preferred form) to toggle detailed output; this is an intentional API flag, not
      # a control-flow smell.
      - ConsoleKit::Doctor::Reporter#initialize
  # rubocop:Style/Documentation conflict — RuboCop requires doc comments (Style/Documentation) on
  # every module/class, but adding module docs to tiny internal Structs clutters the code without
  # adding value.
  IrresponsibleModule:
    exclude:
      - ConsoleKit::StepRegistry::Entry
      - ConsoleKit::Steps::Base::Result
      # rubocop:Style/Documentation conflict — Base::Result is a tiny internal Struct that carries
      # check output; adding a module doc comment adds no value and clutters the code.
      - ConsoleKit::Doctor::Checks::Base::Result
  # rubocop:Metrics/CyclomaticComplexity conflict — print_banner uses style parameter to select color.
  # This is intentional dispatch, not control flow smell. build_message uses timestamp parameter to
  # control whether to include time in output — intentional parameter dispatch, not control flow smell.
  ControlParameter:
    exclude:
      - ConsoleKit::Output#print_banner
      - ConsoleKit::Output#build_message
      # rubocop:Style/MethodParameters conflict — ShardResolver#resolve is a pure lookup keyed by
      # tenant_key. The parameter selects which tenant entry to look up; this is the public API,
      # not a control-flow smell.
      - ConsoleKit::Connections::ShardResolver#resolve
  FeatureEnvy:
    exclude:
      # Reporter#print_result formats and prints a single Result value object. Accessing its three
      # fields (status, message, check) is the definition of formatting a value object — this is
      # not envy but intentional presenter logic that belongs in Reporter, not in Result.
      - ConsoleKit::Doctor::Reporter#print_result
  # rubocop:Metrics/MethodLength conflict — render_banner_lines unpacks context hash and renders
  # three output statements. Extracting further would reduce clarity without improving maintainability.
  # rubocop:Metrics/MethodLength conflict — EnvResolver#call validates env variable, looks up tenant,
  # and configures context. Extracting further would split cohesive validation logic unnecessarily.
  # rubocop:Metrics/MethodLength conflict — SafeguardCheck#call uses guard-clause style returns
  # (early return for scoped, no-op return for safe environments, conditional confirm). Each statement
  # is a distinct guard; collapsing them reduces readability of this intentional step logic.
  # rubocop:Metrics/MethodLength conflict — TenantConfigurator#call performs three sequential guards
  # before delegating; TenantConfigurator#configure_tenant orchestrates five cohesive side-effect
  # steps (apply, connect, push, mark, print) that belong together as a single transaction-like unit;
  # TenantConfigurator#apply_context iterates the field mapping and checks each attribute — splitting
  # further would obscure the mapping logic.
  TooManyStatements:
    exclude:
      - ConsoleKit::Output#render_banner_lines
      - ConsoleKit::Steps::EnvResolver#call
      - ConsoleKit::Steps::SafeguardCheck#call
      - ConsoleKit::Steps::TenantConfigurator#call
      - ConsoleKit::Steps::TenantConfigurator#configure_tenant
      - ConsoleKit::Steps::TenantConfigurator#apply_context
      # rubocop:Metrics/MethodLength conflict — TenantConfigurator#configure_tenant orchestrates
      # two rescue clauses for distinct error types (missing config vs general error). Each rescue
      # is a separate concern; merging them would obscure error-type differentiation.
      - ConsoleKit::TenantConfigurator#configure_tenant
      # rubocop:Metrics/MethodLength conflict — print_step_timings pre-computes slowest_name once
      # and iterates sorted timings to emit one line per step. Extracting the block body to a helper
      # causes ControlParameter (boolean marker arg) and FeatureEnvy smells on the extracted method.
      # Collapsing further would require passing slowest into each sub-method, restoring the smell.
      - ConsoleKit::Benchmarker#print_step_timings
      # rubocop:Metrics/MethodLength conflict — run_steps iterates pipeline_steps and returns early
      # on first failure. Extracting run_step as a separate method causes two FeatureEnvy warnings
      # (refers to step_class and result more than self). Keeping it inline is the cleanest design.
      - ConsoleKit::SwitchPipeline#run_steps
  # rubocop:Metrics/MethodLength conflict — SafeguardCheck#current_env reads global state (ENV/Rails)
  # to determine the current environment. It intentionally has no instance state dependency because
  # environment detection is a pure lookup — moving it out of the class would break encapsulation.
  # SafeguardCheck#confirmed? interacts with $stdin and Output to prompt the operator; it belongs
  # in the step class as part of the confirmation flow and needs no instance state by design.
  # TenantConfigurator#case_mismatch? and #warn_case_mismatch are pure helper predicates/actions
  # that operate only on their arguments. Extracting them to a separate class would break cohesion
  # with apply_context which calls them as tightly coupled helpers.
  UtilityFunction:
    exclude:
      - ConsoleKit::ConsoleHelpers#switch_tenant
      - ConsoleKit::ConsoleHelpers#tenant_info
      - ConsoleKit::ConsoleHelpers#tenants
      - ConsoleKit::Steps::SafeguardCheck#current_env
      - ConsoleKit::Steps::SafeguardCheck#confirmed?
      # rubocop:Style/MethodParameters conflict — TenantSelector#aborted? takes a key parameter to
      # keep resolve_tenant readable and avoid instance-variable assumption smells. It is a pure
      # guard predicate that belongs in the step class; extracting it elsewhere would break cohesion.
      - ConsoleKit::Steps::TenantSelector#aborted?
      - ConsoleKit::Steps::TenantConfigurator#case_mismatch?
      - ConsoleKit::Steps::TenantConfigurator#warn_case_mismatch
      # rubocop:Naming/MethodName conflict — Prompt#rails_or_env_var reads global environment state
      # to determine the deployment environment. It intentionally has no instance state because
      # environment detection is a pure lookup. Placing it in Prompt keeps environment selection
      # logic co-located with tenant_label; extracting it elsewhere would unnecessarily scatter
      # prompt configuration logic across multiple classes.
      - ConsoleKit::Prompt#rails_or_env_var
      # rubocop:Style/ClassMethodsDefinitions conflict — NullShardStrategy and
      # RailsConnectedToStrategy are stateless Strategy objects by design (Null Object and
      # Strategy patterns). Their public interface methods operate only on their arguments and
      # global Rails state; promoting them to module functions would break ShardStrategyFactory's
      # polymorphic dispatch.
      - ConsoleKit::Connections::NullShardStrategy#wrap
      - ConsoleKit::Connections::RailsConnectedToStrategy#available?
      - ConsoleKit::Connections::RailsConnectedToStrategy#wrap
      # Doctor check helpers that probe external state (ActiveRecord, Rails, hook registry) are
      # intentionally stateless at the Ruby level — they act on global singletons, not instance
      # variables. Extracting them to separate classes would fragment cohesive check logic.
      - ConsoleKit::Doctor::Checks::AdapterSupported#detected_adapter
      - ConsoleKit::Doctor::Checks::ShardingCompatibility#rails_version_sufficient?
      - ConsoleKit::Doctor::Checks::HookCallableArity#arity_issues_for
      # Reporter#format_count is a tiny string-formatting helper that belongs with the reporter's
      # output logic; extracting it to a separate class would scatter presentation concerns.
      - ConsoleKit::Doctor::Reporter#format_count
      # rubocop:Metrics/MethodLength conflict — clock_ms is a single-line timing helper that reads
      # a global clock. It has no instance state to reference by design (clocks are stateless reads).
      # Extracting it to a module function would break private encapsulation; inlining it causes
      # Reek's DuplicateMethodCall smell. Suppressing UtilityFunction is the only clean path.
      - ConsoleKit::Benchmarker#clock_ms
  # RuboCop:Naming/RescuedExceptionsVariableName requires 'e' for rescued exception variables.
  # Reek flags 'e' as uncommunicative, but this is the standard naming convention.
  UncommunicativeVariableName:
    exclude:
      - ConsoleKit::Steps::BeforeHooks#call
      - ConsoleKit::Steps::AfterHooks#call
      - ConsoleKit::Steps::TenantConfigurator#call
      - ConsoleKit::Connections::RailsConnectedToStrategy#wrap
      # rubocop:Naming/RescuedExceptionsVariableName requires 'e' for rescued exception variables.
      # Reek flags 'e' as uncommunicative, but this is the standard naming convention.
      - ConsoleKit::Doctor::Checks::ContextClassResolvable#call
      # rubocop:Naming/RescuedExceptionsVariableName requires 'e' for rescued exception variables.
      # Reek flags 'e' as uncommunicative, but this is the standard naming convention.
      - ConsoleKit::HookRegistry#run
      # rubocop:Naming/RescuedExceptionsVariableName requires 'e' for rescued exception variables.
      # Reek flags 'e' as uncommunicative, but this is the standard naming convention.
      - ConsoleKit::TenantConfigurator#configure_tenant
